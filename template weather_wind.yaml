 - trigger:
      - trigger: state
        entity_id: weather.forecast_casa
      - trigger: time_pattern
        hours: "/1"
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_casa
        data:
          type: daily
        response_variable: forecast_data
    sensor:
      - name: "Weather Forecast Day 0 Wind Speed"
        unique_id: weather_forecast_day_0_wind_speed
        unit_of_measurement: "km/h"
        state: "{{ forecast_data['weather.forecast_casa'].forecast[0].wind_speed | default('0') }}"
      - name: "Weather Forecast Day 0 Wind Bearing"
        unique_id: weather_forecast_day_0_wind_bearing
        unit_of_measurement: "°"
        state: "{{ forecast_data['weather.forecast_casa'].forecast[0].wind_bearing | default('0') }}"
      - name: "Weather Forecast Day 1 Wind Speed"
        unique_id: weather_forecast_day_1_wind_speed
        unit_of_measurement: "km/h"
        state: "{{ forecast_data['weather.forecast_casa'].forecast[1].wind_speed | default('0') }}"
