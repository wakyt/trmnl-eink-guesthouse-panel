display:
  - platform: waveshare_epaper
    id: epaper_display
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    rotation: 90
    model: "7.50inv2p"
    update_interval: never
    full_update_every: 30

    lambda: |-
      auto color_off = Color(0, 0, 0);       // "bianco" logico — invertito per questo pannello (7.50inv2p)
      auto color_on = Color(255, 255, 255);  // "nero" logico — invertito per questo pannello

      bool en = id(lingua_en);

      static const char* giorni_it[] = {"domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"};
      static const char* giorni_it_abbr[] = {"Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"};
      static const char* giorni_en_abbr[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
      static const char* mesi_it[] = {"gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"};
      static const char* punti_cardinali_it[] = {"N", "NE", "E", "SE", "S", "SO", "O", "NO"};
      static const char* punti_cardinali_en[] = {"N", "NE", "E", "SE", "S", "SW", "W", "NW"};

      auto traduci_meteo = [&](const std::string& cond) -> std::string {
        if (en) {
          if (cond == "clear-night") return "clear";
          if (cond == "cloudy") return "cloudy";
          if (cond == "fog") return "fog";
          if (cond == "hail") return "hail";
          if (cond == "lightning") return "thunderstorm";
          if (cond == "lightning-rainy") return "thunderstorm & rain";
          if (cond == "partlycloudy") return "partly cloudy";
          if (cond == "pouring") return "heavy rain";
          if (cond == "rainy") return "rainy";
          if (cond == "snowy") return "snowy";
          if (cond == "snowy-rainy") return "sleet";
          if (cond == "sunny") return "sunny";
          if (cond == "windy") return "windy";
          if (cond == "windy-variant") return "windy";
          if (cond == "exceptional") return "exceptional";
          return cond;
        }
        if (cond == "clear-night") return "sereno";
        if (cond == "cloudy") return "nuvoloso";
        if (cond == "fog") return "nebbia";
        if (cond == "hail") return "grandine";
        if (cond == "lightning") return "temporale";
        if (cond == "lightning-rainy") return "temporale e pioggia";
        if (cond == "partlycloudy") return "parz. nuvoloso";
        if (cond == "pouring") return "pioggia intensa";
        if (cond == "rainy") return "pioggia";
        if (cond == "snowy") return "neve";
        if (cond == "snowy-rainy") return "nevischio";
        if (cond == "sunny") return "soleggiato";
        if (cond == "windy") return "ventoso";
        if (cond == "windy-variant") return "ventoso";
        if (cond == "exceptional") return "eccezionale";
        return cond;
      };

      // Weather Icons (erikflowers) — if/else esplicito invece di una
      // mappa, per evitare typo silenziosi sui codepoint
      auto get_icon = [](const std::string& cond) -> const char* {
        if (cond == "sunny") return "\U0000F00D";
        if (cond == "clear-night") return "\U0000F02E";
        if (cond == "cloudy") return "\U0000F013";
        if (cond == "partlycloudy") return "\U0000F002";
        if (cond == "fog") return "\U0000F014";
        if (cond == "hail") return "\U0000F015";
        if (cond == "lightning") return "\U0000F01E";
        if (cond == "lightning-rainy") return "\U0000F01E";
        if (cond == "pouring") return "\U0000F019";
        if (cond == "rainy") return "\U0000F01A";
        if (cond == "snowy") return "\U0000F01B";
        if (cond == "snowy-rainy") return "\U0000F017";
        if (cond == "windy") return "\U0000F050";
        if (cond == "windy-variant") return "\U0000F012";
        return "\U0000F07B"; // n/a
      };

      int currentPage = id(current_page);

      if (currentPage == 0) {
        it.fill(color_off);

        // --- Data grande, centrata, riempie la larghezza (tranne spazio batteria) ---
        auto now = id(ha_time).now();
        struct tm timeinfo = now.to_c_tm();
        if (en) {
          char day_buf[16], month_buf[16];
          strftime(day_buf, sizeof(day_buf), "%A", &timeinfo);
          strftime(month_buf, sizeof(month_buf), "%B", &timeinfo);
          it.printf(210, 12, id(font_roboto_700_46), color_on, TextAlign::TOP_CENTER, "%s %d", day_buf, timeinfo.tm_mday);
          it.printf(210, 12 + 54, id(font_roboto_400_25), color_on, TextAlign::TOP_CENTER, "%s", month_buf);
        } else {
          it.printf(210, 12, id(font_roboto_700_46), color_on, TextAlign::TOP_CENTER, "%s %d", giorni_it[timeinfo.tm_wday], timeinfo.tm_mday);
          it.printf(210, 12 + 54, id(font_roboto_400_25), color_on, TextAlign::TOP_CENTER, "%s", mesi_it[timeinfo.tm_mon]);
        }

        // --- Batteria, in alto a destra (x:443 y:22) ---
        {
          const char* bat_icon = "\U000F0082";
          float bat_level = 0;
          if (id(battery_level).has_state()) {
            bat_level = id(battery_level).state;
            if (std::isnan(bat_level)) bat_level = 0;
            if (bat_level >= 95) bat_icon = "\U000F0079";
            else if (bat_level >= 85) bat_icon = "\U000F0082";
            else if (bat_level >= 75) bat_icon = "\U000F0081";
            else if (bat_level >= 65) bat_icon = "\U000F0080";
            else if (bat_level >= 55) bat_icon = "\U000F007F";
            else if (bat_level >= 45) bat_icon = "\U000F007E";
            else if (bat_level >= 35) bat_icon = "\U000F007D";
            else if (bat_level >= 25) bat_icon = "\U000F007C";
            else if (bat_level >= 15) bat_icon = "\U000F007B";
            else if (bat_level >= 5) bat_icon = "\U000F007A";
            else bat_icon = "\U000F0083";
          }
          it.printf(443, 22, id(font_material_design_icons_400_26), color_on, "%s", bat_icon);
          it.printf(443 + 13, 22 + 28, id(font_roboto_400_12), color_on, TextAlign::TOP_CENTER, "%.0f%%", bat_level);
        }

        // --- Meteo attuale: icona (spostata a sx) + testo + umidità (y:101) ---
        {
          std::string cond_now = id(weather_forecast_casa).state;
          it.printf(68, 101, id(font_weather_icons_20), color_on, "%s", get_icon(cond_now));
          it.printf(68 + 24, 101, id(font_roboto_400_14), color_on, TextAlign::TOP_LEFT, "%s", traduci_meteo(cond_now).c_str());
        }
        {
          it.printf(190, 101, id(font_weather_icons_16), color_on, "\U0000F07A");
          it.printf(190 + 20, 101, id(font_roboto_400_14), color_on, TextAlign::TOP_LEFT, "%.0f%%", id(current_humidity).state);
        }

        // --- Vento attuale: icona windsock + testo (senza etichetta "Direzione vento:") ---
        it.printf(260, 101, id(font_material_design_icons_400_27), color_on, "%s", "\U000F15FA");
        {
          std::string direzione_testo = id(sensor_direzione_vento).state;
          std::string velocita_testo = id(sensor_velocita_vento).state;
          it.printf(260 + 32, 101, id(font_roboto_400_14), color_on, TextAlign::TOP_LEFT, "%s %s", direzione_testo.c_str(), velocita_testo.c_str());
        }

        // --- Temperatura attuale e percepita, subito sotto (y:128) ---
        {
          it.printf(68, 128, id(font_weather_icons_16), color_on, "\U0000F055");
          it.printf(68 + 20, 128, id(font_roboto_400_14), color_on, TextAlign::TOP_LEFT, "%.1f°C", id(current_temp).state);
        }
        {
          it.printf(190, 128, id(font_weather_icons_16), color_on, "\U0000F053");
          it.printf(190 + 20, 128, id(font_roboto_400_14), color_on, TextAlign::TOP_LEFT, en ? "Feels %.1f°C" : "Perc. %.1f°C", id(temperatura_apparente).state);
        }

        // --- Titolo sezione "Meteo" (x:143 y:180) ---
        it.printf(143 + 100, 180 + 20, id(font_roboto_400_25), color_on, TextAlign::CENTER, en ? "Weather" : "Meteo");

        // --- Previsioni 5 giorni (y:245) ---
        int giorni_offset[5] = {0, 1, 2, 3, 4};
        int col_x[5] = {43, 123, 203, 283, 363};
        for (int i = 0; i < 5; i++) {
          int dx = col_x[i];
          int dy = 245;
          std::string nome_giorno;
          if (giorni_offset[i] == 0) {
            nome_giorno = en ? "Today" : "Oggi";
          } else {
            ESPTime futuro = ESPTime::from_epoch_local(now.timestamp + (giorni_offset[i] * 86400));
            nome_giorno = en ? giorni_en_abbr[futuro.day_of_week - 1] : giorni_it_abbr[futuro.day_of_week - 1];
          }
          it.printf(dx + 40, dy, id(font_roboto_700_12), color_on, TextAlign::TOP_CENTER, "%s", nome_giorno.c_str());

          std::string cond; float high = NAN, low = NAN;
          switch (i) {
            case 0: cond = id(weather_cond_day0).state; high = id(weather_high_day0).state; low = id(weather_low_day0).state; break;
            case 1: cond = id(weather_cond_day1).state; high = id(weather_high_day1).state; low = id(weather_low_day1).state; break;
            case 2: cond = id(weather_cond_day2).state; high = id(weather_high_day2).state; low = id(weather_low_day2).state; break;
            case 3: cond = id(weather_cond_day3).state; high = id(weather_high_day3).state; low = id(weather_low_day3).state; break;
            case 4: cond = id(weather_cond_day4).state; high = id(weather_high_day4).state; low = id(weather_low_day4).state; break;
          }
          // rimuove spazi/a-capo che i template Jinja a volte lasciano in coda
          while (!cond.empty() && std::isspace((unsigned char)cond.back())) cond.pop_back();
          size_t start = cond.find_first_not_of(" \t\n\r");
          if (start != std::string::npos) cond = cond.substr(start);
          it.printf(dx + 40, dy + 16, id(font_weather_icons_32), color_on, TextAlign::TOP_CENTER, "%s", get_icon(cond));
          if (!std::isnan(high) && !std::isnan(low)) {
            it.printf(dx + 40, dy + 62, id(font_roboto_400_14), color_on, TextAlign::TOP_CENTER, "%.0f°/%.0f°", high, low);
          }
        }

        // --- Previsioni vento 5 giorni, stesso stile, sotto il meteo (y:335) ---
        // Icona dinamica in base all'intensità (scala Beaufort): weather-icons
        // non ha glyph per singola direzione (servirebbe una rotazione), quindi
        // l'icona cambia in base a quanto è forte il vento, non alla direzione
        static const char* beaufort_icons[] = {
          "\U0000F0B7", "\U0000F0B8", "\U0000F0B9", "\U0000F0BA", "\U0000F0BB",
          "\U0000F0BC", "\U0000F0BD", "\U0000F0BE", "\U0000F0BF", "\U0000F0C0",
          "\U0000F0C1", "\U0000F0C2", "\U0000F0C3"
        };
        auto beaufort_da_nodi = [](float nodi) -> int {
          static const float soglie[] = {1, 3, 6, 10, 16, 21, 27, 33, 40, 47, 55, 63};
          for (int b = 0; b < 12; b++) if (nodi < soglie[b]) return b;
          return 12;
        };
        for (int i = 0; i < 5; i++) {
          int dx = col_x[i];
          int dy = 320;
          float w_speed = NAN, w_bearing = NAN;
          switch (i) {
            case 0: w_speed = id(wind_speed_day0).state; w_bearing = id(wind_bearing_day0).state; break;
            case 1: w_speed = id(wind_speed_day1).state; w_bearing = id(wind_bearing_day1).state; break;
            case 2: w_speed = id(wind_speed_day2).state; w_bearing = id(wind_bearing_day2).state; break;
            case 3: w_speed = id(wind_speed_day3).state; w_bearing = id(wind_bearing_day3).state; break;
            case 4: w_speed = id(wind_speed_day4).state; w_bearing = id(wind_bearing_day4).state; break;
          }
          if (!std::isnan(w_speed) && !std::isnan(w_bearing)) {
            int dir_idx = ((int)((w_bearing + 22.5f) / 45.0f)) % 8;
            float nodi = w_speed / 1.852f;
            int b = beaufort_da_nodi(nodi);
            it.printf(dx + 40, dy, id(font_weather_icons_32), color_on, TextAlign::TOP_CENTER, "%s", beaufort_icons[b]);
            it.printf(dx + 40, dy + 36, id(font_roboto_400_14), color_on, TextAlign::TOP_CENTER, en ? "%.1f kn" : "%.1f nodi", nodi);
            it.printf(dx + 40, dy + 54, id(font_roboto_400_14), color_on, TextAlign::TOP_CENTER, "%s", en ? punti_cardinali_en[dir_idx] : punti_cardinali_it[dir_idx]);
          }
        }


        // --- QR wifi e portale, impilati a destra dell'immagine raccolta ---
        it.printf(330 + 60, 415, id(font_roboto_400_20), color_on, TextAlign::TOP_CENTER, "Wi-Fi");
        it.qr_code(330, 445, id(wifi_qr), color_on, 4);

        it.printf(330 + 60, 600, id(font_roboto_400_20), color_on, TextAlign::TOP_CENTER, en ? "Useful Info" : "Info utili");
        it.qr_code(330, 630, id(portal_qr), color_on, 4);

        // --- Screenshot card raccolta differenziata (x:20 y:410, ~265x400) ---
        if (en) {
          it.image(20, 390, id(raccolta_card_en), color_off, color_on);
        } else {
          it.image(20, 390, id(raccolta_card_it), color_off, color_on);
        }

      } else if (currentPage == 1) {
        it.fill(color_off);
        if (en) {
          it.image(0, 0, id(checkin_image_en), color_off, color_on);
        } else {
          it.image(0, 0, id(checkin_image_it), color_off, color_on);
        }

      } else if (currentPage == 2) {
        it.fill(color_off);
        if (en) {
          it.image(0, 0, id(checkout_image_en), color_off, color_on);
        } else {
          it.image(0, 0, id(checkout_image_it), color_off, color_on);
        }
      }
