# ============================================================================
# Pannello e-ink TRMNL DIY (Seeed) — layout da ESPHomeDesigner, tradotto in
# italiano, con gestione batteria via deep_sleep e pagine check-in/check-out
# ============================================================================

substitutions:
  # IP locale della tua istanza Home Assistant — unico punto da cambiare
  # per adattare questo file a un'altra installazione.
  ha_ip: "!secret ha_ip"

esphome:
  name: e-paper-v1
  friendly_name: e-paper v1
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      - deep_sleep.prevent: deep_sleep_1
      # aspetta wifi + api prima di leggere l'helper "Pannello Pagina" da HA
      - wait_until:
          condition:
            wifi.connected:
          timeout: 15s
      - wait_until:
          condition:
            api.connected:
          timeout: 15s
      - delay: 1s   # piccolo margine per la sincronizzazione iniziale degli stati
      - lambda: |-
          std::string pagina = id(pannello_pagina_helper).state;
          if (pagina == "Check-in") {
            id(current_page) = 1;
          } else if (pagina == "Check-out") {
            id(current_page) = 2;
          } else {
            id(current_page) = 0;
          }
          std::string lingua = id(pannello_lingua_helper).state;
          id(lingua_en) = (lingua == "English");
      - if:
          condition:
            lambda: 'return id(current_page) == 0 && !id(lingua_en);'
          then:
            - component.update: raccolta_card_it
      - if:
          condition:
            lambda: 'return id(current_page) == 0 && id(lingua_en);'
          then:
            - component.update: raccolta_card_en
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && !id(lingua_en);'
          then:
            - component.update: checkin_image_it
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && id(lingua_en);'
          then:
            - component.update: checkin_image_en
      - if:
          condition:
            lambda: 'return id(current_page) == 2 && !id(lingua_en);'
          then:
            - component.update: checkout_image_it
      - if:
          condition:
            lambda: 'return id(current_page) == 2 && id(lingua_en);'
          then:
            - component.update: checkout_image_en
      - delay: 40s
      - component.update: epaper_display
      - deep_sleep.allow: deep_sleep_1

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "e-paper v1 Fallback Hotspot"
    password: !secret ap_password

captive_portal:

globals:
  - id: current_page
    type: int
    restore_value: false
    initial_value: '0'   # 0 = home info, 1 = check-in, 2 = check-out
  - id: lingua_en
    type: bool
    restore_value: false
    initial_value: 'false'   # false = italiano, true = English

deep_sleep:
  id: deep_sleep_1
  run_duration: 70s
  sleep_duration: 45min
  wakeup_pin:
    number: GPIO2
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

spi:
  - id: spi_bus
    clk_pin: GPIO7
    mosi_pin: GPIO9

http_request:
  verify_ssl: false
  timeout: 35s
  watchdog_timeout: 40s

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_battery_enable

time:
  - platform: homeassistant
    id: ha_time

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    name: "Pannello Tasto Refresh (KEY1)"
    id: key1_refresh
    on_press:
      - component.update: epaper_display

  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Pannello Pagina Successiva (KEY2)"
    id: key2_next_page
    on_press:
      - lambda: |-
          id(current_page) = (id(current_page) + 1) % 3;
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && !id(lingua_en);'
          then:
            - component.update: checkin_image_it
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && id(lingua_en);'
          then:
            - component.update: checkin_image_en
      - if:
          condition:
            lambda: 'return id(current_page) == 2 && !id(lingua_en);'
          then:
            - component.update: checkout_image_it
      - if:
          condition:
            lambda: 'return id(current_page) == 2 && id(lingua_en);'
          then:
            - component.update: checkout_image_en
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            - component.update: epaper_display

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Pannello Pagina Precedente (KEY3)"
    id: key3_prev_page
    on_press:
      - lambda: |-
          id(current_page) = (id(current_page) + 2) % 3;
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && !id(lingua_en);'
          then:
            - component.update: checkin_image_it
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && id(lingua_en);'
          then:
            - component.update: checkin_image_en
      - if:
          condition:
            lambda: 'return id(current_page) == 2 && !id(lingua_en);'
          then:
            - component.update: checkout_image_it
      - if:
          condition:
            lambda: 'return id(current_page) == 2 && id(lingua_en);'
          then:
            - component.update: checkout_image_en
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            - component.update: epaper_display

# --- Pulsanti virtuali esposti in HA: utili per pilotare check-in/check-out
# da un'automazione o da un pulsante in dashboard, non solo da tasto fisico ---
button:
  - platform: template
    name: "Pannello Vai a Home"
    on_press:
      - lambda: 'id(current_page) = 0;'
      - component.update: epaper_display
  - platform: template
    name: "Pannello Vai a Check-in"
    on_press:
      - lambda: 'id(current_page) = 1;'
      - if:
          condition:
            lambda: 'return !id(lingua_en);'
          then:
            - component.update: checkin_image_it
          else:
            - component.update: checkin_image_en
  - platform: template
    name: "Pannello Vai a Check-out"
    on_press:
      - lambda: 'id(current_page) = 2;'
      - if:
          condition:
            lambda: 'return !id(lingua_en);'
          then:
            - component.update: checkout_image_it
          else:
            - component.update: checkout_image_en
  - platform: template
    name: "Pannello Refresh"
    on_press:
      - component.update: epaper_display

# --- Screenshot ritagliato della card raccolta differenziata: crea in HA
# una view Lovelace dedicata con dentro solo quella card, dimensione 265x257
# (le stesse dimensioni del riquadro immagine nel tuo layout) ---
online_image:
  - id: raccolta_card_it
    format: PNG
    type: BINARY
    buffer_size: 30000
    url: "http://${ha_ip}:10000/dashboard-mobile/eink-raccolta?viewport=265xauto&lang=it&theme=default"
    update_interval: never
    on_download_finished:
      - component.update: epaper_display
      - deep_sleep.allow: deep_sleep_1

  - id: raccolta_card_en
    format: PNG
    type: BINARY
    buffer_size: 30000
    url: "http://${ha_ip}:10000/dashboard-mobile/eink-raccolta-eng?viewport=265xauto&lang=en&theme=default"
    update_interval: never
    on_download_finished:
      - component.update: epaper_display
      - deep_sleep.allow: deep_sleep_1

  - id: checkin_image_it
    format: PNG
    type: BINARY
    buffer_size: 65000
    url: "http://${ha_ip}:8123/local/checkin.png"
    update_interval: never
    on_download_finished:
      - component.update: epaper_display

  - id: checkin_image_en
    format: PNG
    type: BINARY
    buffer_size: 65000
    url: "http://${ha_ip}:8123/local/checkin_en.png"
    update_interval: never
    on_download_finished:
      - component.update: epaper_display

  - id: checkout_image_it
    format: PNG
    type: BINARY
    buffer_size: 65000
    url: "http://${ha_ip}:8123/local/checkout.png"
    update_interval: never
    on_download_finished:
      - component.update: epaper_display

  - id: checkout_image_en
    format: PNG
    type: BINARY
    buffer_size: 65000
    url: "http://${ha_ip}:8123/local/checkout_en.png"
    update_interval: never
    on_download_finished:
      - component.update: epaper_display

qr_code:
  - id: wifi_qr
    value: !secret wifi_qr_string
  - id: portal_qr
    value: "http://192.168.1.1/captive-portal"   # sostituisci col tuo URL

sensor:
  # --- Umidità attuale (attributo di weather.forecast_casa) ---
  - platform: homeassistant
    id: current_humidity
    entity_id: weather.forecast_casa
    attribute: humidity
    internal: true
  # --- Temperatura attuale (stazione WS90) e percepita ---
  - platform: homeassistant
    id: current_temp
    entity_id: sensor.casa_ecowitt_ws90_temperatura
    internal: true
  - platform: homeassistant
    id: temperatura_apparente
    entity_id: sensor.temperatura_percepita_casa
    internal: true

  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    filters:
      - calibrate_linear:
          - 4.15 -> 100
          - 3.96 -> 90
          - 3.91 -> 80
          - 3.85 -> 70
          - 3.8 -> 60
          - 3.75 -> 50
          - 3.68 -> 40
          - 3.58 -> 30
          - 3.49 -> 20
          - 3.41 -> 10
          - 3.3 -> 5
          - 3.27 -> 0
      - clamp:
          min_value: 0
          max_value: 100

  # --- Previsioni meteo (temperature) — dai template sensor HA ---
  - platform: homeassistant
    id: weather_high_day0
    entity_id: sensor.weather_forecast_day_0_high
    internal: true
  - platform: homeassistant
    id: weather_low_day0
    entity_id: sensor.weather_forecast_day_0_low
    internal: true
  - platform: homeassistant
    id: weather_high_day1
    entity_id: sensor.weather_forecast_day_1_high
    internal: true
  - platform: homeassistant
    id: weather_low_day1
    entity_id: sensor.weather_forecast_day_1_low
    internal: true
  - platform: homeassistant
    id: weather_high_day2
    entity_id: sensor.weather_forecast_day_2_high
    internal: true
  - platform: homeassistant
    id: weather_low_day2
    entity_id: sensor.weather_forecast_day_2_low
    internal: true
  - platform: homeassistant
    id: weather_high_day3
    entity_id: sensor.weather_forecast_day_3_high
    internal: true
  - platform: homeassistant
    id: weather_low_day3
    entity_id: sensor.weather_forecast_day_3_low
    internal: true
  - platform: homeassistant
    id: weather_high_day4
    entity_id: sensor.weather_forecast_day_4_high
    internal: true
  - platform: homeassistant
    id: weather_low_day4
    entity_id: sensor.weather_forecast_day_4_low
    internal: true

  # --- Previsioni vento per giorno (NUOVI — vanno aggiunti in HA, vedi
  # blueprint in fondo al file) ---
  - platform: homeassistant
    id: wind_speed_day0
    entity_id: sensor.weather_forecast_day_0_wind_speed
    internal: true
  - platform: homeassistant
    id: wind_bearing_day0
    entity_id: sensor.weather_forecast_day_0_wind_bearing
    internal: true
  - platform: homeassistant
    id: wind_speed_day1
    entity_id: sensor.weather_forecast_day_1_wind_speed
    internal: true
  - platform: homeassistant
    id: wind_bearing_day1
    entity_id: sensor.weather_forecast_day_1_wind_bearing
    internal: true
  - platform: homeassistant
    id: wind_speed_day2
    entity_id: sensor.weather_forecast_day_2_wind_speed
    internal: true
  - platform: homeassistant
    id: wind_bearing_day2
    entity_id: sensor.weather_forecast_day_2_wind_bearing
    internal: true
  - platform: homeassistant
    id: wind_speed_day3
    entity_id: sensor.weather_forecast_day_3_wind_speed
    internal: true
  - platform: homeassistant
    id: wind_bearing_day3
    entity_id: sensor.weather_forecast_day_3_wind_bearing
    internal: true
  - platform: homeassistant
    id: wind_speed_day4
    entity_id: sensor.weather_forecast_day_4_wind_speed
    internal: true
  - platform: homeassistant
    id: wind_bearing_day4
    entity_id: sensor.weather_forecast_day_4_wind_bearing
    internal: true

text_sensor:
  - platform: homeassistant
    id: weather_forecast_casa
    entity_id: weather.forecast_casa
    internal: true

  # --- Helper HA che indica quale pagina mostrare, controllato ad ogni risveglio ---
  - platform: homeassistant
    id: pannello_pagina_helper
    entity_id: input_select.pannello_e_paper
    internal: true

  # --- Helper HA che indica la lingua della pagina home ---
  - platform: homeassistant
    id: pannello_lingua_helper
    entity_id: input_select.pannello_lingua
    internal: true

  # --- Vento attuale: entrambi testuali (es. "4.64 kn" e "E Levante") ---
  - platform: homeassistant
    id: sensor_velocita_vento
    entity_id: sensor.velocita_vento
    internal: true
  - platform: homeassistant
    id: sensor_direzione_vento
    entity_id: sensor.direzione_vento
    internal: true

  - platform: homeassistant
    id: weather_cond_day0
    entity_id: sensor.weather_forecast_day_0_condition
    internal: true
  - platform: homeassistant
    id: weather_cond_day1
    entity_id: sensor.weather_forecast_day_1_condition
    internal: true
  - platform: homeassistant
    id: weather_cond_day2
    entity_id: sensor.weather_forecast_day_2_condition
    internal: true
  - platform: homeassistant
    id: weather_cond_day3
    entity_id: sensor.weather_forecast_day_3_condition
    internal: true
  - platform: homeassistant
    id: weather_cond_day4
    entity_id: sensor.weather_forecast_day_4_condition
    internal: true

